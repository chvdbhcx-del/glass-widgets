[package]
name = "mswidgets"
version = "0.5.1"
edition = "2021"
description = "Glass Widgets: native (no WebView) Direct2D desktop widgets for Windows with a Liquid-Glass look"
license = "MIT"
repository = "https://github.com/chvdbhcx-del/glass-widgets"

[[bin]]
name = "mswidgets"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[dependencies.windows]
version = "0.58"
features = [
  "Foundation_Numerics",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  # superset for widget authors (so nobody has to touch this file): shell/power/time/storage/network/clipboard/audio/WinRT media
  "Win32_UI_Shell",
  "Win32_Security",
  "Win32_System_Time",
  "Win32_System_Power",
  "Win32_System_Shutdown",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_DataExchange",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Media_Control",
  # added by the lead for widget authors: HTTP (weather/rates), edit controls, DWM, registry (read-only use), DDC brightness, shell items
  "Win32_Networking_WinHttp",
  "Win32_UI_Controls",
  "Win32_Graphics_Dwm",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_Registry",
  "Win32_Devices_Display",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Console",
  "Devices_Radios",
]

[build-dependencies]
winresource = "0.1" # embeds installer/icon.ico and the version info into the exe

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "unwind" # widget panics are caught per call (cards.rs), the process survives
